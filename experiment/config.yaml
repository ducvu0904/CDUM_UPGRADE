# CDUM experiment configuration for the Criteo uplift dataset.
# CLI arguments override these values.

data:
  path: "/home/ducvu0904/Documents/dataset/Criteo"
  label_col: "visit"
  num_workers: 4

model:
  name: "cpm_dynamic_fusion" # Also: "cdum", "cpm", "cpm_three_branch_dynamic_fusion"
  input_dim: 12
  router_hidden_dim: 32 # Router hidden dimension for cpm_dynamic_fusion
  valor_hidden_dim: 128 # VALOR MLP hidden dimension for cpm_dynamic_fusion
  prognostic_hidden_dim: null # Three-branch only; null -> cdum.expert_hidden_dim

training:
  epochs: 30
  batch_size: 4096
  lr: 0.001 
  lr_factor: 0.6
  lr_patience: 2
  min_lr: 0.000001
  weight_decay: 0.000001
  patience: 5
  monitor_metric: "val_auuc"
  device: null
  seeds: [1, 2, 3, 4, 5]

# Coarse-grained Preference Modeling component of CDUM.
cdum:
  num_features: 12
  num_bins: 101
  embedding_dim: 32
  treatment_dim: 128
  seq_len: 10
  num_experts: 3
  expert_hidden_dim: 256
  expert_dim: 64
  tower_hidden_dim: 32
  refine_hidden_dim: 64
  refine_dim: 32
  activation: "relu"
  dropout_rate: 0.0
  batch_norm: false
  l2_reg: 0.000000
  huber_delta: 1.0
  router_hidden_dim: 32
  valor_hidden_dim: 128

output:
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  run_name: null
  eval_k: 0.3
  verbose: 1
